name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish static site to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages:gh-pages

          rm -rf /tmp/cogniform-pages
          git worktree add /tmp/cogniform-pages gh-pages

          find /tmp/cogniform-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp index.html styles.css app.js /tmp/cogniform-pages/
          cp -R data /tmp/cogniform-pages/
          cp -R lexicon /tmp/cogniform-pages/
          cp -R preview /tmp/cogniform-pages/
          touch /tmp/cogniform-pages/.nojekyll

          git -C /tmp/cogniform-pages add -A

          if git -C /tmp/cogniform-pages diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi

          git -C /tmp/cogniform-pages commit -m "Publish site from main"
          git -C /tmp/cogniform-pages push origin gh-pages
